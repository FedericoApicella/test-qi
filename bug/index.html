<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Segnalazioni ricevute</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800&family=Spline+Sans+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="../stile.css">
<link rel="manifest" href="../manifest.webmanifest">
<style>
.bugs{display:grid;gap:10px}
.bug{display:grid;gap:6px}
.bug .top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.85rem;color:var(--muted)}
.bug .st{font-weight:800;border-radius:999px;padding:2px 10px;font-size:.78rem;color:#fff;background:#999}
.bug .st.nuovo{background:#e11d48}.bug .st.in_corso{background:#f59e0b}.bug .st.risolto{background:#16a34a}
.bug .msg{font-size:1.05rem;white-space:pre-wrap;word-break:break-word}
.bug .meta{font-size:.85rem;color:var(--muted);word-break:break-word}
.bug .err{font-family:var(--font-mono);font-size:.75rem;white-space:pre-wrap;word-break:break-all;color:#b91c1c}
.bug .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.bug .row .btn{padding:6px 12px;font-size:.85rem}
.bug input{font:inherit;padding:6px 10px;border-radius:10px;border:1px solid var(--border);flex:1 1 140px;min-width:0;background:var(--bg);color:inherit}
.filtri{display:flex;gap:6px;flex-wrap:wrap}
.filtri .btn{padding:6px 12px;font-size:.85rem}
.filtri .btn.on{background:var(--grad);color:#fff;border-color:transparent}
</style>
</head>
<body>
<div class="bar">
  <div class="bar-in">
    <div class="title"><a href="../" style="color:inherit;text-decoration:none">🧠 Mente Allenata</a> · Segnalazioni</div>
    <div class="scores"></div>
  </div>
</div>
<main class="wrap" style="display:grid;gap:14px">
  <section class="card" style="display:grid;gap:8px">
    <h1 style="margin:0;font-size:1.3rem">🛠 Segnalazioni ricevute</h1>
    <p class="hint" style="margin:0">Bug ed errori segnalati dagli utenti con «🐞 Segnala un errore» nel menu ⚙️. Le stesse righe sono nella scheda <b>bug</b> del foglio Google.</p>
    <div id="stato" class="note small">Caricamento…</div>
    <div class="filtri" id="filtri" hidden>
      <button type="button" class="btn on" data-f="aperti">Da fare</button>
      <button type="button" class="btn" data-f="risolto">Risolti</button>
      <button type="button" class="btn" data-f="tutti">Tutti</button>
      <button type="button" class="btn" id="ricarica">↻ Aggiorna</button>
      <button type="button" class="btn" id="copia">📋 Copia per Claude</button>
    </div>
  </section>
  <section class="bugs" id="lista"></section>
</main>
<script>window.RACCOLTA_ENDPOINT="https://script.google.com/macros/s/AKfycbzgsmL26nxf3wzvzADgJ4ulpLXbfru19l_NfYDS-NGeXM5lYN4QLITrEe-sNHm23iBi/exec";</script>
<script src="../sfide/effetti.js"></script>
<script src="../js/lingua.js"></script>
<script src="../js/menu.js"></script>
<script src="../js/segnala.js"></script>
<script src="../js/account.js"></script>
<script src="../js/pwa.js"></script>
<script>
(function () {
  'use strict';
  var lista = document.getElementById('lista'), stato = document.getElementById('stato'), filtri = document.getElementById('filtri');
  var bugs = [], filtro = 'aperti';
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function token() { try { var a = JSON.parse(localStorage.getItem('testqi.account')); return a && a.token; } catch (e) { return null; } }
  function chiama(d) {
    return fetch(window.RACCOLTA_ENDPOINT, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(d) })
      .then(function (r) { return r.text(); }).then(function (t) { var o; try { o = JSON.parse(t); } catch (e) { throw new Error('Risposta inattesa dal server: ' + t.slice(0, 80)); } if (!o.ok) throw new Error(o.errore || 'errore'); return o; });
  }
  function quando(iso) { if (!iso) return ''; var d = new Date(iso); return isNaN(d) ? String(iso) : d.toLocaleString('it-IT', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }); }
  function nomeStato(s) { return { nuovo: 'Nuovo', in_corso: 'In corso', risolto: 'Risolto' }[s] || s; }
  function visibili() { return bugs.filter(function (b) { return filtro === 'tutti' || (filtro === 'risolto' ? b.stato === 'risolto' : b.stato !== 'risolto'); }); }
  function disegna() {
    var v = visibili();
    lista.innerHTML = v.length ? v.map(function (b) {
      return '<article class="card bug" data-id="' + esc(b.id) + '">' +
        '<div class="top"><span class="st ' + esc(b.stato) + '">' + esc(nomeStato(b.stato)) + '</span><span>' + esc(quando(b.ricevuto)) + '</span>' + (b.utente ? '<span>👤 ' + esc(b.utente) + '</span>' : '') + '<span style="margin-left:auto;font-family:var(--font-mono)">' + esc(b.id) + '</span></div>' +
        '<div class="msg">' + esc(b.messaggio) + '</div>' +
        '<div class="meta">📄 <a href="' + esc(b.pagina) + '">' + esc(b.pagina) + '</a>' + (b.contesto ? ' · 🎯 ' + esc(b.contesto) : '') + ' · 📱 ' + esc(b.dispositivo) + ' · ' + esc(b.schermo) + (b.titolo ? ' · «' + esc(b.titolo) + '»' : '') + '</div>' +
        (b.errori_js ? '<div class="err">⚠️ ' + esc(b.errori_js) + '</div>' : '') +
        (b.extra_json ? '<div class="err" style="color:var(--muted)">' + esc(b.extra_json) + '</div>' : '') +
        '<div class="row">' +
          (b.stato !== 'in_corso' && b.stato !== 'risolto' ? '<button type="button" class="btn" data-st="in_corso">🔧 In corso</button>' : '') +
          (b.stato !== 'risolto' ? '<button type="button" class="btn primary" data-st="risolto">✅ Risolto</button>' : '<button type="button" class="btn" data-st="nuovo">↩ Riapri</button>') +
          '<input type="text" placeholder="nota (facoltativa)" value="' + esc(b.nota) + '" data-nota>' +
        '</div></article>';
    }).join('') : '<div class="card"><p class="hint" style="margin:0">' + (filtro === 'aperti' ? 'Nessuna segnalazione da fare. 🎉' : 'Niente qui.') + '</p></div>';
  }
  function carica() {
    var t = token();
    if (!t) { stato.innerHTML = 'Per vedere le segnalazioni devi <b>accedere</b> con il tuo account (pulsante in alto a destra).'; filtri.hidden = true; lista.innerHTML = ''; return; }
    stato.textContent = 'Caricamento…';
    chiama({ azione: 'bug_lista', token: t }).then(function (o) {
      bugs = o.bug || [];
      var aperti = bugs.filter(function (b) { return b.stato !== 'risolto'; }).length;
      stato.textContent = bugs.length ? aperti + ' da fare su ' + bugs.length + ' ricevute.' : 'Nessuna segnalazione ricevuta finora.';
      filtri.hidden = false; disegna();
    }, function (e) {
      filtri.hidden = true; lista.innerHTML = '';
      stato.textContent = /amministratori|Sessione/.test(e.message) ? e.message : 'Non riesco a leggere le segnalazioni: ' + e.message + ' (il server Apps Script potrebbe non essere ancora aggiornato: vedi docs/bug.md).';
    });
  }
  lista.addEventListener('click', function (e) {
    var b = e.target.closest('[data-st]'); if (!b) return;
    var art = b.closest('.bug'), id = art.getAttribute('data-id'), nota = art.querySelector('[data-nota]').value;
    b.disabled = true;
    chiama({ azione: 'bug_stato', token: token(), id: id, stato: b.getAttribute('data-st'), nota: nota }).then(function () {
      bugs.forEach(function (x) { if (x.id === id) { x.stato = b.getAttribute('data-st'); x.nota = nota; } });
      stato.textContent = bugs.filter(function (x) { return x.stato !== 'risolto'; }).length + ' da fare su ' + bugs.length + ' ricevute.';
      disegna();
    }, function (err) { b.disabled = false; alert(err.message); });
  });
  filtri.addEventListener('click', function (e) {
    var b = e.target.closest('[data-f]'); if (!b) return;
    filtro = b.getAttribute('data-f');
    filtri.querySelectorAll('[data-f]').forEach(function (x) { x.classList.toggle('on', x === b); });
    disegna();
  });
  document.getElementById('ricarica').addEventListener('click', carica);
  document.getElementById('copia').addEventListener('click', function () {
    var txt = visibili().map(function (b) {
      return '- [' + nomeStato(b.stato) + '] ' + b.id + ' · ' + quando(b.ricevuto) + (b.utente ? ' · ' + b.utente : '') + '\n  ' + b.messaggio.replace(/\n/g, '\n  ') +
        '\n  pagina: ' + b.pagina + (b.contesto ? ' · ' + b.contesto : '') + ' · ' + b.dispositivo + ' · ' + b.schermo + (b.errori_js ? '\n  errori: ' + b.errori_js.replace(/\n/g, ' | ') : '') + (b.nota ? '\n  nota: ' + b.nota : '');
    }).join('\n');
    var fine = function () { var b = document.getElementById('copia'); b.textContent = '✅ Copiato'; setTimeout(function () { b.textContent = '📋 Copia per Claude'; }, 1500); };
    if (navigator.clipboard) navigator.clipboard.writeText(txt).then(fine, function () { prompt('Copia:', txt); });
    else prompt('Copia:', txt);
  });
  window.addEventListener('testqi:account', carica);
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') carica(); });
  carica();
})();
</script>
</body>
</html>
