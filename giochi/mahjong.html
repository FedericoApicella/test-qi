<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mahjong a livelli · Mente Allenata</title>
<meta name="description" content="Mahjong solitario a livelli infiniti: disposizioni sempre risolvibili che crescono di livello in livello, aiuti, mescola e grafiche che si sbloccano giocando.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800&family=Spline+Sans+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="../stile.css">
<link rel="stylesheet" href="giochi.css">
<style>.wrap{max-width:980px}</style>
</head>
<body>
<div class="bar ingame">
  <div class="bar-in">
    <div class="title">🀄 Mahjong</div>
    <div class="scores" id="barScores"></div>
    <div class="timer mono" id="barTimer">0:00</div>
    <span id="barSound"></span>
    <span id="cardAccedi"></span>
  </div>
</div>
<main class="wrap" id="app">
  <div class="g-top"><h1>🀄 Mahjong</h1><div class="g-meta" id="gMeta"></div><div class="g-btns" id="gBtns"></div></div>
  <div class="g-board mj-wrap" id="boardWrap"><div class="mj-slots" id="slots" aria-label="Parcheggio tessere"></div><div class="mj" id="board" aria-label="Tessere del mahjong"></div></div>
  <div class="g-tools">
    <span class="btn" style="cursor:default">🀄 Restano <span class="n" id="restN">0</span></span>
    <button class="btn" id="bUndo">↩️ Annulla</button>
    <button class="btn" id="bHint">💡 Aiuto <span class="n" id="hintN">0</span></button>
    <button class="btn" id="bShuf">🔀 Mescola <span class="n" id="shufN">0</span></button>
  </div>
  <div class="g-msg" id="msg" aria-live="polite"></div>
  <p class="foot"><a href="./" style="color:var(--muted)">Tutti i giochi</a> · <a href="../" style="color:var(--muted)">Mente Allenata</a></p>
</main>
<script src="../sfide/effetti.js"></script>
<script src="../js/menu.js"></script>
<script src="../js/segnala.js"></script>
<script src="comune.js"></script>
<script src="tessere.js"></script>
<script src="mahjong.js"></script>
<script>window.RACCOLTA_ENDPOINT="https://script.google.com/macros/s/AKfycbzgsmL26nxf3wzvzADgJ4ulpLXbfru19l_NfYDS-NGeXM5lYN4QLITrEe-sNHm23iBi/exec";</script>
<script src="../js/account.js"></script>
</body>
</html>
