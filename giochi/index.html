<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Giochi a livelli · Sudoku, Mahjong e Queens · Mente Allenata</title>
<meta name="description" content="Tre giochi di logica a livelli infiniti: Sudoku, Mahjong solitario e Queens. La difficoltà sale piano, si ferma dove vuoi tu, e ogni 25 livelli si sblocca una nuova grafica.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800&family=Spline+Sans+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="../stile.css">
<link rel="stylesheet" href="giochi.css">
</head>
<body>
<div class="bar">
  <div class="bar-in">
    <a class="back" href="../" aria-label="Home">←</a>
    <div class="title">🎮 Giochi a livelli</div>
    <div class="scores" id="barScores"></div>
    <span id="barSound" style="margin-left:auto"></span>
    <span id="cardAccedi"></span>
  </div>
</div>
<main class="wrap" id="app">
  <section class="hero">
    <div class="eyebrow">Tre classici · livelli infiniti · difficoltà a scelta</div>
    <h1>Sudoku, Mahjong e Queens</h1>
    <p>Si parte facile e si sale piano: ogni livello è un po' più difficile del precedente, fino al tetto che scegli tu.</p>
    <div class="kpis" id="kpis"></div>
  </section>
  <section class="stack">
    <div class="sec-head"><h2>Scegli il gioco</h2><button class="btn" id="bSet">⚙️ Impostazioni</button></div>
    <div class="g-cards" id="cards"></div>
  </section>
  <p class="foot"><a href="../" style="color:var(--muted)">Mente Allenata</a> · test, sfide, allenamento e giochi</p>
</main>
<script src="../sfide/effetti.js"></script>
<script src="comune.js"></script>
<script>
(function(){
'use strict';
const G=window.Giochi,FX=window.Effetti,$=(s)=>document.querySelector(s),esc=G.esc;
let P=G.load();
const DESC={sudoku:'Griglie 4×4, poi 6×6, poi 9×9 con sempre meno numeri dati. Soluzione sempre unica, note a matita e aiuti.',mahjong:'Togli le tessere a coppie uguali. Disposizioni a più piani, sempre risolvibili, che crescono livello dopo livello.',queens:'Una regina per riga, colonna e colore, senza che si tocchino. Da 5×5 a 11×11, una sola soluzione.'};
function disegna(){
  P=G.load();G.applySkin(P);const tot=G.totale(P),st=G.stelleTot(P);
  $('#kpis').innerHTML=`<div class="kpi"><b>${tot}</b><span>livelli completati</span></div><div class="kpi"><b>${st}</b><span>stelle</span></div><div class="kpi"><b>${P.imp.max}/10</b><span>tetto difficoltà</span></div>`;
  $('#cards').innerHTML=Object.keys(G.GIOCHI).map(k=>{const g=G.GIOCHI[k],p=P[k];const n=Object.keys(p.stelle).length;const d=G.diffOf(p.next,P.imp);const stars=Object.values(p.stelle).reduce((a,b)=>a+b,0);
    return`<a class="g-card" href="${g.file}"><span class="ic">${g.ic}</span><b>${g.nome}</b><span class="hint">${DESC[k]}</span>
      <div class="lv"><span>Livello <span class="mono">${p.next}</span></span><span>${G.stelleDiff(d)} ${esc(G.nomeDiff(d))}</span></div>
      <div class="track"><i style="width:${Math.min(100,(p.next-1)%25/25*100)}%"></i></div>
      <div class="lv"><span>${n} completat${n===1?'o':'i'}</span><span>★ ${stars}</span></div>
      <span class="cta">${n?(p.corso?'Riprendi il livello '+p.corso.level:'Gioca il livello '+p.next):'Inizia'} →</span></a>`}).join('');
}
$('#bSet').addEventListener('click',()=>G.impostazioni(P,disegna));
G.onSync=disegna;
$('#barSound').innerHTML=FX.soundButtonHtml();FX.bindSoundButton();
disegna();
})();
</script>
<script>window.RACCOLTA_ENDPOINT="https://script.google.com/macros/s/AKfycbzgsmL26nxf3wzvzADgJ4ulpLXbfru19l_NfYDS-NGeXM5lYN4QLITrEe-sNHm23iBi/exec";</script>
<script src="../js/account.js"></script>
</body>
</html>
