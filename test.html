<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<script>window.RACCOLTA_ENDPOINT="https://script.google.com/macros/s/AKfycbzgsmL26nxf3wzvzADgJ4ulpLXbfru19l_NfYDS-NGeXM5lYN4QLITrEe-sNHm23iBi/exec";</script>

<title>Test QI Multidominio</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800&family=Spline+Sans+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="stile.css">
<style>
/* Stili propri del test; i token di tema e gli stili comuni sono in stile.css. */
/* Layout: una colonna centrata (max 720px); barra di stato sticky con sezione · item · timer; le schermate si alternano nello stesso contenitore. */
*{box-sizing:border-box}
html,body{height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3{text-wrap:balance;line-height:1.2;margin:0}
h2{font-size:1.35rem;font-weight:600}
h3{font-size:1.05rem;font-weight:600}
p{margin:0}
button,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
svg{display:block;max-width:100%}

/* barra di stato */
.bar-in{max-width:720px;margin:0 auto;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:12px;min-height:52px}
.bar .sec{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .cnt{color:var(--muted);font-family:var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.bar .timer{margin-left:auto;font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-weight:600;padding:4px 10px;border-radius:6px;background:var(--accent-soft);color:var(--fg);white-space:nowrap}
.bar .timer.low{background:var(--warn-soft);color:var(--warn)}
.bar .timer.hidden-timer{visibility:hidden}
.progress{height:3px;background:var(--border)}
.progress>i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}

/* pagina */
.wrap{max-width:720px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:24px}
.eyebrow{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.lede{font-size:1.1rem;color:var(--muted);max-width:60ch}
.stack{display:grid;gap:12px}
.note{background:var(--warn-soft);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent);color:var(--fg);border-radius:10px;padding:14px 16px;font-size:.95rem}
.note strong{color:var(--warn)}
.btn:hover{border-color:var(--fg)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.domains{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.domain{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 16px;display:grid;gap:4px}
.domain b{font-weight:600}
.domain span{color:var(--muted);font-size:.9rem}
table{border-collapse:collapse;width:100%;font-size:.95rem}
td,th{text-align:left;padding:8px 6px;border-bottom:1px solid var(--border);vertical-align:top}
th{font-weight:600;color:var(--muted);font-size:.85rem;text-transform:uppercase;letter-spacing:.05em}
td.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums;text-align:right}
.field{display:grid;gap:6px}
.field label{font-weight:500}
.field input,.field select{font:inherit;padding:10px 12px;border:2px solid var(--border);border-radius:8px;background:var(--surface);color:var(--fg);width:100%;max-width:360px}
.field input{font-family:var(--font-mono);font-size:1.4rem;letter-spacing:.15em}
.field input:focus,.field select:focus{border-color:var(--accent);outline:none}
.hint{color:var(--muted);font-size:.9rem}

/* item */
.q{font-size:1.15rem;font-weight:500}
.q .small{display:block;color:var(--muted);font-size:.9rem;font-weight:400;margin-top:4px}
.seq{font-family:var(--font-mono);font-size:clamp(1.4rem,5vw,2rem);font-weight:600;letter-spacing:.04em;display:flex;flex-wrap:wrap;gap:.3em .6em;align-items:baseline}
.seq .qm{color:var(--accent)}
.analogy{font-size:clamp(1.3rem,4.5vw,1.8rem);font-weight:600;display:flex;flex-wrap:wrap;gap:.25em .5em;align-items:baseline}
.analogy .qm{color:var(--accent)}
.analogy .op{color:var(--muted);font-weight:400}
.opts{display:grid;gap:10px}
.opts.text{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.opts.fig{grid-template-columns:repeat(auto-fit,minmax(100px,1fr))}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt .k{font-family:var(--font-mono);font-size:.8rem;color:var(--muted);flex:none;width:1.4em}
.opt .v{font-weight:500;min-width:0;overflow-wrap:anywhere}
.opt.fig{flex-direction:column;align-items:center;gap:6px;padding:10px}
.opt.fig svg{width:100%;height:auto;max-width:110px;aspect-ratio:1;color:var(--fg)}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;max-width:360px;width:100%;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px}
.grid3 .cell{aspect-ratio:1;min-width:0;border:1px solid var(--border);border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--fg)}
.grid3 .cell svg{width:92%;height:92%}
.grid3 .cell.ask{border:2px dashed var(--accent);color:var(--accent);font-family:var(--font-mono);font-size:1.8rem;font-weight:600}
.figbox{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;display:inline-flex;color:var(--fg)}
.figbox svg{width:150px;height:150px;aspect-ratio:1}
.memshow{height:160px;display:flex;align-items:center;justify-content:center;background:var(--surface);border:1px solid var(--border);border-radius:12px;font-family:var(--font-mono);font-size:4rem;font-weight:600;letter-spacing:.05em}
.memshow.small{font-size:1.05rem;color:var(--muted);font-family:var(--font-body);font-weight:400}

/* risultati */
.score{display:grid;gap:6px;padding:26px 24px;background:var(--surface);border:1px solid var(--border);border-radius:20px;box-shadow:var(--shadow)}
.score .big{font-family:var(--font-mono);font-size:clamp(2.6rem,9vw,4rem);font-weight:600;line-height:1;font-variant-numeric:tabular-nums;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.score .ci{color:var(--muted)}
.score .label{font-weight:600;color:var(--accent)}
.bars{display:grid;gap:10px}
.barrow{display:grid;grid-template-columns:minmax(120px,160px) 1fr auto;gap:12px;align-items:center}
.barrow .name{font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.barrow .track{height:12px;background:var(--border);border-radius:6px;overflow:hidden}
.barrow .track>i{display:block;height:100%;background:var(--accent);border-radius:6px}
.barrow .val{font-family:var(--font-mono);font-variant-numeric:tabular-nums;color:var(--muted);font-size:.9rem;white-space:nowrap}
.flags{display:grid;gap:8px}
.flag{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:8px;background:var(--warn-soft);font-size:.95rem}
.flag.ok{background:var(--ok-soft)}
details{border:1px solid var(--border);border-radius:10px;background:var(--surface)}
details summary{cursor:pointer;padding:12px 16px;font-weight:600}
details .body{padding:0 16px 16px;display:grid;gap:12px}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:.8rem;font-weight:600}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.skip{background:var(--border);color:var(--muted)}
.rev{display:grid;gap:8px}
.revrow{display:grid;grid-template-columns:2.2rem 1fr auto;gap:10px;align-items:center;font-size:.95rem;padding:6px 0;border-bottom:1px solid var(--border)}
.revrow .n{font-family:var(--font-mono);color:var(--muted)}
.revrow .d{min-width:0;overflow-wrap:anywhere}
.example{display:flex;flex-wrap:wrap;gap:16px;align-items:center}
.example .cap{font-size:.85rem;color:var(--muted);text-align:center}
.example .ex{display:grid;gap:4px;justify-items:center}
.example svg{width:72px;height:72px;aspect-ratio:1;color:var(--fg)}
@media (max-width:480px){
  .barrow{grid-template-columns:1fr auto;}
  .barrow .track{grid-column:1/-1}
  .grid3{max-width:100%}
}
@media (prefers-reduced-motion:reduce){ .progress>i{transition:none} }
</style>
</head>
<body>

<div class="bar">
  <div class="bar-in">
    <div class="sec" id="barSec"><a href="./" style="color:var(--brand);text-decoration:none">Test QI</a></div>
    <div class="cnt" id="barCnt"></div>
    <div class="timer mono hidden-timer" id="barTimer">--:--</div>
  </div>
  <div class="progress"><i id="barProg"></i></div>
</div>
<main class="wrap" id="app" aria-live="polite"></main>

<script>
(function(){
'use strict';
// Versione degli item: cambia quando cambia anche un solo item (gli id restano stabili per item invariati).
const QI_VERSION='2.2';
// Endpoint facoltativo (es. Google Apps Script) per la raccolta anonima: window.RACCOLTA_ENDPOINT o window.QI_SUBMIT_URL.
const QI_SUBMIT_URL=(window.RACCOLTA_ENDPOINT||window.QI_SUBMIT_URL||'');

// ========================= utilità =========================
const $=(s)=>document.querySelector(s);
const esc=(s)=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let uid=0;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuffled(arr,rng){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const pick=(arr,rng)=>arr[Math.floor(rng()*arr.length)];
// options[0] è la risposta corretta: mescola e registra l'indice
function withAnswer(options,rng){const perm=shuffled(options.map((_,i)=>i),rng);return{options:perm.map(i=>options[i]),answer:perm.indexOf(0)}}
const fmtTime=(s)=>`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
const LETTERS='ABCDEF';

// ========================= disegno figure =========================
const SHAPE={
  circle:(x,y,r)=>`<circle cx="${x}" cy="${y}" r="${r}"/>`,
  square:(x,y,r)=>`<rect x="${x-r}" y="${y-r}" width="${2*r}" height="${2*r}"/>`,
  triangle:(x,y,r)=>`<polygon points="${x},${y-r} ${x+r*0.95},${y+r*0.72} ${x-r*0.95},${y+r*0.72}"/>`,
  diamond:(x,y,r)=>`<polygon points="${x},${y-r} ${x+r},${y} ${x},${y+r} ${x-r},${y}"/>`,
  pent:(x,y,r)=>{const p=[];for(let k=0;k<5;k++){const a=-Math.PI/2+k*2*Math.PI/5;p.push(`${(x+r*Math.cos(a)).toFixed(1)},${(y+r*Math.sin(a)).toFixed(1)}`)}return`<polygon points="${p.join(' ')}"/>`},
  hex:(x,y,r)=>{const p=[];for(let k=0;k<6;k++){const a=k*Math.PI/3;p.push(`${(x+r*Math.cos(a)).toFixed(1)},${(y+r*Math.sin(a)).toFixed(1)}`)}return`<polygon points="${p.join(' ')}"/>`},
  arrow:(x,y,r)=>`<polygon points="${x},${y-r} ${x+r*0.85},${y+r*0.7} ${x},${y+r*0.25} ${x-r*0.85},${y+r*0.7}"/>`,
};
function drawShape(sh,x,y,r,fill,rot){
  const p=SHAPE[sh](x,y,r), tr=rot?` transform="rotate(${rot} ${x} ${y})"`:'';
  const line=`stroke="currentColor" stroke-width="3.5" stroke-linejoin="round"`;
  if(fill==='full')return`<g${tr} fill="currentColor" ${line}>${p}</g>`;
  if(fill==='none')return`<g${tr} fill="none" ${line}>${p}</g>`;
  const id='cl'+(++uid);
  return`<g${tr}><clipPath id="${id}"><rect x="${x-r-3}" y="${y-r-3}" width="${r+3}" height="${2*r+6}"/></clipPath><g fill="currentColor" clip-path="url(#${id})">${p}</g><g fill="none" ${line}>${p}</g></g>`;
}
const SEG={h0:[20,20,80,20],h1:[20,50,80,50],h2:[20,80,80,80],v0:[20,20,20,80],v1:[50,20,50,80],v2:[80,20,80,80],d1:[20,20,80,80],d2:[80,20,20,80]};
const SEG_KEYS=Object.keys(SEG);
const POS={1:[[50,50,26]],2:[[30,50,17],[70,50,17]],3:[[50,27,14],[28,71,14],[72,71,14]],4:[[30,30,15],[70,30,15],[30,70,15],[70,70,15]]};
const SIZE_MULT={s:0.6,m:1,l:1.3};
function cellSVG(spec,attrs){
  let inner='';
  if(spec.segs){inner=spec.segs.map(k=>{const s=SEG[k];return`<line x1="${s[0]}" y1="${s[1]}" x2="${s[2]}" y2="${s[3]}" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>`}).join('')}
  else{
    let els=spec.els;
    if(els.length===1&&spec.count>1)els=Array.from({length:spec.count},()=>els[0]);
    const pos=POS[els.length];
    inner=els.map((e,k)=>{const p=pos[k];const r=p[2]*(SIZE_MULT[e.size||'m']);return drawShape(e.shape,p[0],p[1],r,e.fill,e.rot||0)}).join('');
  }
  return`<svg viewBox="0 0 100 100" ${attrs||''} aria-hidden="true">${inner}</svg>`;
}
function cellsSVG(cells,mark,attrs){ // polimino, con eventuale cella marcata
  const xs=cells.map(c=>c[0]),ys=cells.map(c=>c[1]);
  const w=Math.max(...xs)+1,h=Math.max(...ys)+1,n=Math.max(w,h,4);
  const u=100/n,ox=(n-w)/2*u,oy=(n-h)/2*u;
  const rects=cells.map(c=>`<rect x="${(ox+c[0]*u+1.5).toFixed(1)}" y="${(oy+c[1]*u+1.5).toFixed(1)}" width="${(u-3).toFixed(1)}" height="${(u-3).toFixed(1)}" rx="2"/>`).join('');
  let dot='';
  if(mark){dot=`<circle cx="${(ox+mark[0]*u+u/2).toFixed(1)}" cy="${(oy+mark[1]*u+u/2).toFixed(1)}" r="${(u*0.22).toFixed(1)}" fill="var(--surface)"/>`}
  return`<svg viewBox="0 0 100 100" ${attrs||''} aria-hidden="true"><g fill="currentColor" stroke="currentColor" stroke-width="1">${rects}</g>${dot}</svg>`;
}

// ========================= item: matrici =========================
// Generatore ispirato alla struttura di MaRs-IB (Chierchia et al., 2019): celle con 1-3 elementi,
// ciascun attributo (forma, riempimento, dimensione, rotazione, numero) governato da una regola
// per riga, per colonna o a quadrato latino. Più elementi e più regole → item più difficile.
const SHAPES5=['circle','square','triangle','diamond','pent','hex'],FL=['none','half','full'],SZ=['s','m','l'],ROT=[0,45,90],CNT=[1,2,3];
const POOL={shape:SHAPES5,fill:FL,size:SZ,rot:ROT,count:CNT};
const MAT_SPECS=[
  {slots:1,rules:[['shape','row']]},
  {slots:1,rules:[['fill','col']]},
  {slots:1,rules:[['count','row']]},
  {slots:1,rules:[['shape','latin']]},
  {slots:1,rules:[['shape','row'],['fill','col']]},
  {slots:1,rules:[['rot','col'],['fill','row']],arrow:true},
  {slots:1,rules:[['shape','latin'],['fill','latin2']]},
  {overlay:'add',k:2},
  {slots:1,rules:[['shape','latin'],['fill','latin2'],['count','row']]},
  {slots:2,rules:[['shape','row',0],['fill','col',1]]},
  {slots:2,rules:[['shape','latin',0],['size','col',1]]},
  {overlay:'xor',k:2},
  {slots:1,rules:[['shape','latin'],['fill','latin2'],['size','latin']]},
  {slots:2,rules:[['shape','latin',0],['fill','latin2',0],['shape','col',1]]},
  {slots:3,rules:[['shape','row',0],['fill','col',1],['size','row',2]]},
  {overlay:'add',k:3},
  {slots:2,rules:[['shape','latin',0],['fill','latin2',0],['shape','latin2',1],['fill','col',1]]},
  {slots:3,rules:[['shape','latin',0],['fill','latin2',1],['size','latin',2],['fill','row',0]]},
  {overlay:'xor',k:3},
  {slots:3,rules:[['shape','latin',0],['fill','latin2',0],['size','latin',1],['shape','col',1],['fill','row',2]]},
  // item 21-40: seconda scala, usata dalla forma estesa
  {slots:1,rules:[['fill','row']]},
  {slots:1,rules:[['size','col']]},
  {slots:1,rules:[['count','col']]},
  {slots:1,rules:[['fill','latin']]},
  {slots:1,rules:[['shape','col'],['size','row']]},
  {slots:1,rules:[['rot','row'],['fill','col']],arrow:true},
  {slots:1,rules:[['fill','latin'],['size','latin2']]},
  {overlay:'add',k:2},
  {slots:1,rules:[['shape','latin2'],['count','col'],['fill','row']]},
  {slots:2,rules:[['fill','row',0],['shape','col',1]]},
  {slots:2,rules:[['size','latin',0],['shape','latin2',1]]},
  {overlay:'xor',k:2},
  {slots:1,rules:[['shape','latin2'],['fill','latin'],['size','row'],['count','col']]},
  {slots:2,rules:[['shape','latin2',0],['size','latin',0],['fill','row',1]]},
  {slots:3,rules:[['fill','row',0],['shape','col',1],['shape','row',2]]},
  {overlay:'add',k:3},
  {slots:2,rules:[['shape','latin',0],['size','latin2',0],['fill','latin',1],['shape','row',1]]},
  {slots:3,rules:[['shape','latin2',0],['fill','latin',1],['shape','latin',2],['size','col',1]]},
  {overlay:'xor',k:3},
  {slots:3,rules:[['shape','latin',0],['fill','latin2',0],['shape','latin2',1],['fill','col',1],['size','row',2]]},
];
const RULE_TEXT={row:'cambia per riga',col:'cambia per colonna',latin:'quadrato latino (ogni valore una volta per riga e colonna)',latin2:'quadrato latino inverso'};
const ATTR_TEXT={shape:'forma',fill:'riempimento',size:'dimensione',rot:'rotazione',count:'numero'};
function ruleIndex(type,r,c){return type==='row'?r:type==='col'?c:type==='latin'?(r+c)%3:(r+2*c)%3}
function cellKey(spec){return JSON.stringify(spec.segs?{segs:spec.segs.slice().sort()}:{els:spec.els.map(e=>[e.shape,e.fill,e.size||'m',e.rot||0]),count:spec.count||1})}
function buildSlotItem(spec,rng){
  const n=spec.slots;
  // valori base per slot
  const base=[];const shapeSet=shuffled(SHAPES5,rng);
  for(let k=0;k<n;k++)base.push({shape:spec.arrow?'arrow':shapeSet[k],fill:pick(FL,rng),size:'m',rot:0});
  let count=1;
  // pool di valori per ogni regola
  const rules=spec.rules.map(([attr,type,slot])=>{
    let vals;
    if(attr==='shape')vals=shuffled(shapeSet,rng).slice(0,3);
    else vals=shuffled(POOL[attr],rng);
    return{attr,type,slot:slot||0,vals};
  });
  const cellAt=(r,c)=>{
    const els=base.map(b=>Object.assign({},b));let cnt=1;
    rules.forEach(ru=>{const v=ru.vals[ruleIndex(ru.type,r,c)];if(ru.attr==='count')cnt=v;else els[ru.slot][ru.attr]=v});
    return{els,count:cnt};
  };
  const grid=[];for(let r=0;r<3;r++)for(let c=0;c<3;c++)grid.push(cellAt(r,c));
  const ans=grid[8];const used=new Set([cellKey(ans)]);const cands=[];
  // distrattori PD: cambia una proprietà; MD: altra cella della griglia
  for(let k=0;k<n;k++)for(const attr of ['shape','fill','size','rot']){
    if(attr==='rot'&&!spec.arrow)continue;
    for(const v of POOL[attr]){if(ans.els[k][attr]===v||(attr==='rot'&&!spec.arrow))continue;
      const d={els:ans.els.map(e=>Object.assign({},e)),count:ans.count};d.els[k][attr]=v;cands.push({d,w:attr==='size'?0.6:1})}
  }
  for(const v of CNT){if(n===1&&v!==ans.count){cands.push({d:{els:ans.els.map(e=>Object.assign({},e)),count:v},w:spec.rules.some(r=>r[0]==='count')?1:0.3})}}
  [5,7,2,6].forEach(i=>cands.push({d:grid[i],w:1.2}));
  const opts=[ans];
  for(const cnd of shuffled(cands,rng).sort((a,b)=>b.w-a.w)){const k=cellKey(cnd.d);if(used.has(k))continue;used.add(k);opts.push(cnd.d);if(opts.length===6)break}

    if(f.mark&&removed[0]===f.mark[0]&&removed[1]===f.mark[1])continue;

    const base=pick(cells,rng);const d=pick([[1,0],[-1,0],[0,1],[0,-1]],rng);const nc=[base[0]+d[0],base[1]+d[1]];

function growShape(n,rng){

// Storico dei risultati nel browser (chiave testqi.risultati, sincronizzata tra dispositivi da js/account.js per chi ha l'account).
function saveLocalResult(){

    const lista=JSON.parse(localStorage.getItem('testqi.risultati')||'[]');
    lista.push({data:new Date(state.finishedAt).toISOString(),forma:NORM.forma,versione:QI_VERSION,qi:R.iq,lo:R.lo,hi:R.hi,pct:R.pct,grezzo:R.raw,totale:TOTAL_ITEMS,domini});
    localStorage.setItem('testqi.risultati',JSON.stringify(lista.slice(-60)));
  }catch(e){}
}
function buildRecord(){
  const R=computeResults();

    const a=state.answers[sec.id];const to=state.timeouts[sec.id];
    sec.items.forEach((it,i)=>{
      const x=a[i];const given=x===null?null:(sec.kind==='memory'?x.given:LETTERS[x]);
      items.push({id:itemId(sec,i),dominio:sec.dominio,corretto:isCorrect(sec,i,x)?1:0,risposta:given||null,rt_ms:state.rts[sec.id][i],scaduto:(to!==undefined&&i>=to)?1:0});

function sendStatusHtml(){

// ========================= punteggio =========================
function isCorrect(sec,idx,ans){
  if(ans===null||ans===undefined)return false;
  if(sec.kind==='memory'){return ans.given===memAnswer(sec.items[idx],ans.seq)}
  return ans===sec.items[idx].answer;
}
function erf(x){const s=Math.sign(x);x=Math.abs(x);const t=1/(1+0.3275911*x);const y=1-(((((1.061405429*t-1.453152027)*t)+1.421413741)*t-0.284496736)*t+0.254829592)*t*Math.exp(-x*x);return s*y}

function rawToIq(raw){const z=(raw-NORM.mean)/NORM.sd;return Math.max(55,Math.min(145,Math.round(100+15*z)))}
function computeResults(){
  const per=SECTIONS.map(sec=>{const a=state.answers[sec.id];let c=0,ans=0;a.forEach((x,i)=>{if(x!==null&&!(sec.kind==='memory'&&x.given==='')){ans++}if(isCorrect(sec,i,x))c++});return{sec,correct:c,answered:ans,n:sec.items.length}});

}
const BANDS=[[130,999,'Molto superiore'],[120,129,'Superiore'],[110,119,'Medio-alto'],[90,109,'Nella media'],[80,89,'Medio-basso'],[70,79,'Basso'],[0,69,'Molto basso']];
function iqLabel(iq){for(const [lo,hi,name]of BANDS)if(iq>=lo&&iq<=hi)return name;return''}
function conversionTableHtml(currentRaw){
  const ci=Math.round(1.96*15*Math.sqrt(1-NORM.rel));
  const rows=[];for(let r=TOTAL_ITEMS;r>=0;r--){const iq=rawToIq(r);const pct=normCdf((iq-100)/15)*100;const cur=r===currentRaw;
    if(r%2===1&&!cur)continue; // una riga ogni due punti, più quella del punteggio ottenuto
    rows.push(`<tr${cur?' style="font-weight:600;background:var(--accent-soft)"':''}><td class="num">${r}</td><td class="num">${iq}</td><td class="num">${Math.max(55,iq-ci)}–${Math.min(145,iq+ci)}</td><td class="num">${pct<1?'<1':pct>99?'>99':Math.round(pct)}</td><td>${iqLabel(iq)}</td></tr>`)}
  const bands=BANDS.map(([lo,hi,name])=>{const p=(normCdf(((Math.min(hi,999)+0.5)-100)/15)-normCdf(((lo-0.5)-100)/15))*100;const rng=lo===0?`< 70`:hi===999?`≥ 130`:`${lo}–${hi}`;return`<tr><td>${rng}</td><td>${name}</td><td class="num">${p<1?p.toFixed(1):Math.round(p)}%</td></tr>`}).join('');
  return`<div class="stack">
    <p class="hint">Conversione provvisoria: assume una media grezza di ${NORM.mean} su ${TOTAL_ITEMS} e una deviazione standard di ${NORM.sd}, cioè QI = 100 + 15 × (grezzo − ${NORM.mean}) / ${NORM.sd}, limitato a 55–145. L'intervallo di confidenza al 95% (±${ci}) deriva da un'attendibilità attesa di ${NORM.rel}, stimata dai parametri pubblicati per item di questo tipo. La media e la DS assunte derivano da una simulazione con i parametri MaRs-IB per le matrici e da stime per gli altri domini: chi fa test online tende a ottenere punteggi alti, quindi la scala è volutamente severa. Quando la taratura reale sarà completata, questa tabella verrà sostituita dalle norme empiriche.</p>
    <div style="overflow-x:auto"><table><thead><tr><th>Grezzo</th><th>QI</th><th>IC 95%</th><th>Percentile</th><th>Fascia</th></tr></thead><tbody>${rows.join('')}</tbody></table></div>
    <h3>Fasce di QI e quota di popolazione attesa</h3>
    <div style="overflow-x:auto"><table><thead><tr><th>QI</th><th>Fascia</th><th>Popolazione</th></tr></thead><tbody>${bands}</tbody></table></div>
    <p class="hint">Le quote per fascia derivano dalla distribuzione normale con media 100 e DS 15, la stessa convenzione dei test clinici (per esempio WAIS-IV): circa il 68% delle persone si colloca tra 85 e 115, circa il 95% tra 70 e 130.</p>
  </div>`;
}

  const nav=(canSkip=true)=>`<div class="actions"><button class="btn primary" id="nextBtn" data-act="next" ${state.sel===null&&sec.kind!=='memory'?'disabled':''}>Conferma</button>${canSkip?`<button class="btn" data-act="skip">Salta</button>`:''}</div>`;
  if(sec.kind==='matrix'){
    const grid=it.grid.map((c,k)=>k===8?`<div class="cell ask">?</div>`:`<div class="cell">${cellSVG(c)}</div>`).join('');
    return`${head}<p class="q">Quale figura completa la griglia?</p><div class="grid3">${grid}</div>
      <div class="opts fig">${it.options.map((o,k)=>`<button class="opt fig" data-i="${k}" aria-label="Opzione ${LETTERS[k]}">${cellSVG(o)}<span class="k">${LETTERS[k]}</span></button>`).join('')}</div>${nav()}`;
  }
  if(sec.kind==='choice'&&sec.id==='num'){
    return`${head}<p class="q">Quale numero continua la serie?</p>
      <div class="seq mono">${it.seq.map(n=>`<span>${n}</span>`).join('')}<span class="qm">?</span></div>
      <div class="opts text">${it.options.map((o,k)=>`<button class="opt" data-i="${k}"><span class="k">${LETTERS[k]}</span><span class="v mono">${o}</span></button>`).join('')}</div>${nav()}`;
  }
  if(sec.kind==='choice'){
    return`${head}<p class="q">Quale parola completa l'analogia?</p>
      <div class="analogy"><span>${esc(it.a)}</span><span class="op">:</span><span>${esc(it.b)}</span><span class="op">=</span><span>${esc(it.c)}</span><span class="op">:</span><span class="qm">?</span></div>
      <div class="opts text">${it.options.map((o,k)=>`<button class="opt" data-i="${k}"><span class="k">${LETTERS[k]}</span><span class="v">${esc(o)}</span></button>`).join('')}</div>${nav()}`;
  }
  if(sec.kind==='rotation'){
    return`${head}<p class="q">Quale alternativa è la stessa figura ruotata (non riflessa)?${it.marked?'<span class="small">Anche il punto bianco deve trovarsi nella cella corrispondente.</span>':''}</p>
      <div class="figbox">${cellsSVG(it.target.cells,it.target.mark)}</div>
      <div class="opts fig">${it.options.map((o,k)=>`<button class="opt fig" data-i="${k}" aria-label="Opzione ${LETTERS[k]}">${cellsSVG(o.f.cells,o.f.mark)}<span class="k">${LETTERS[k]}</span></button>`).join('')}</div>${nav()}`;
  }
  // memoria
  if(!state.mem){state.mem={seq:genMemSeq(it),phase:'show',pos:-1}}
  const instr=it.type==='back'?'Memorizza le cifre: dovrai riscriverle in ordine inverso.':it.type==='fwd'?'Memorizza le cifre: dovrai riscriverle nello stesso ordine.':'Memorizza i simboli: dovrai scrivere prima le cifre in ordine crescente, poi le lettere in ordine alfabetico.';
  if(state.mem.phase==='show'){
    return`${head}<p class="q">${instr}<span class="small">${it.len} simboli</span></p><div class="memshow" id="memShow"><span class="small">Pronto…</span></div>`;
  }
  const label=it.type==='back'?'Scrivi le cifre in ordine inverso':it.type==='fwd'?'Scrivi le cifre nello stesso ordine':'Scrivi prima le cifre in ordine crescente, poi le lettere in ordine alfabetico';
  return`${head}<p class="q">${instr}</p>
    <div class="field"><label for="memInput">${label}</label><input id="memInput" type="text" inputmode="${it.type==='ln'?'text':'numeric'}" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="${it.len}" placeholder="${'·'.repeat(it.len)}"><span class="hint">${it.len} caratteri, senza spazi. Invio per confermare.</span></div>${nav()}`;
}
function runMemShow(){
  clearTimeout(memTimer);
  const box=$('#memShow');if(!box)return;
  const seq=state.mem.seq;let pos=-1;
  const step=()=>{
    if(state.screen!=='item'||!state.mem||state.mem.phase!=='show')return;
    pos++;
    if(pos>=seq.length){box.innerHTML='';memTimer=setTimeout(()=>{if(state.mem){state.mem.phase='input';render()}},400);return}
    box.textContent=seq[pos];
    memTimer=setTimeout(()=>{box.textContent='';memTimer=setTimeout(step,250)},900);
  };
  memTimer=setTimeout(step,900);
}

function rDemo(){
  const sel=(id,label,opts)=>`<div class="field"><label for="${id}">${label}</label><select id="${id}"><option value="">Preferisco non dirlo</option>${opts.map(o=>`<option value="${esc(o[0])}">${esc(o[1])}</option>`).join('')}</select></div>`;
  return`
  <div class="stack"><div class="eyebrow">Test completato</div><h1>Tre domande facoltative</h1>
  <p class="lede">Servono solo per la taratura: permettono di costruire norme per fascia d'età e di controllare che gli item funzionino allo stesso modo per gruppi diversi. Restano anonime.</p></div>
  <div class="card stack">
    ${sel('demoEta','Fascia d\'età',[['<18','Meno di 18'],['18-24','18–24'],['25-34','25–34'],['35-44','35–44'],['45-54','45–54'],['55-64','55–64'],['65+','65 o più']])}
    ${sel('demoStudio','Titolo di studio più alto',[['media','Licenza media'],['diploma','Diploma'],['laurea','Laurea'],['post','Master o dottorato']])}
    ${sel('demoLingua','Lingua madre',[['it','Italiano'],['altra','Altra lingua']])}
  </div>
  <div class="actions"><button class="btn primary" data-act="finishDemo">Vai ai risultati</button></div>`;
}

function rResults(){
  const R=computeResults();
  const dur=state.finishedAt&&state.startedAt?Math.round((state.finishedAt-state.startedAt)/60000):null;
  const flags=[];
  const toCount=Object.keys(state.timeouts).length;
  if(toCount){const names=Object.keys(state.timeouts).map(id=>SECTIONS.find(s=>s.id===id).short).join(', ');flags.push({t:`Tempo scaduto in ${toCount===1?'una sezione':toCount+' sezioni'} (${names}): gli item non raggiunti contano come errati e il punteggio può sottostimare la tua capacità.`})}
  const unanswered=TOTAL_ITEMS-R.per.reduce((n,p)=>n+p.answered,0);
  if(unanswered>=Math.round(TOTAL_ITEMS*0.15))flags.push({t:`${unanswered} item senza risposta: con molte omissioni la stima è meno precisa.`});
  if(state.hidden>=2)flags.push({t:`La pagina è stata lasciata ${state.hidden} volte durante il test: le interruzioni riducono l'attendibilità.`});
  if(R.raw>=TOTAL_ITEMS-3)flags.push({t:'Punteggio vicino al massimo: il test non riesce a distinguere livelli oltre questo valore (effetto tetto).'});
  if(FORM==='short')flags.push({t:'Stima rapida (40 item): la precisione è circa la metà del test completo. Per una misura più attendibile fai il test completo.'});
  if(!flags.length)flags.push({ok:true,t:'Nessuna anomalia nella somministrazione: tutte le sezioni completate nei tempi.'});
  const review=SECTIONS.map(sec=>{
    const rows=sec.items.map((it,i)=>{
      const a=state.answers[sec.id][i];const ok=isCorrect(sec,i,a);const skipped=a===null||(sec.kind==='memory'&&a.given==='');
      let d='';
      if(sec.kind==='matrix')d=`Regola: ${esc(it.rule)} · risposta corretta ${LETTERS[it.answer]}${a!==null?`, data ${LETTERS[a]}`:''}`;
      else if(sec.id==='num')d=`${it.seq.join(', ')}, <b>${it.options[it.answer]}</b> (${esc(it.rule)})${a!==null&&!ok?` · data ${it.options[a]}`:''}`;
      else if(sec.id==='verb')d=`${esc(it.a)} : ${esc(it.b)} = ${esc(it.c)} : <b>${esc(it.options[it.answer])}</b> (${esc(it.rule)})${a!==null&&!ok?` · data ${esc(it.options[a])}`:''}`;
      else if(sec.kind==='memory')d=a&&a.seq.length?`${a.seq.join(' ')} → atteso <b class="mono">${memAnswer(it,a.seq)}</b>${a.given?`, scritto <span class="mono">${esc(a.given)}</span>`:''}`:'non presentato';
      else d=`Corretta: ${LETTERS[it.answer]}${a!==null&&!ok?` · data ${LETTERS[a]} (${it.options[a].kind==='mirror'?'figura riflessa':'figura diversa'})`:''}`;
      return`<div class="revrow"><span class="n">${i+1}</span><span class="d">${d}</span><span class="pill ${ok?'ok':skipped?'skip':'bad'}">${ok?'corretta':skipped?'omessa':'errata'}</span></div>`;
    }).join('');
    return`<h3>${esc(sec.name)}</h3><div class="rev">${rows}</div>`;
  }).join('');
  const shareTxt=`Il mio QI stimato è ${R.iq} (${iqLabel(R.iq).toLowerCase()}, ${R.pct}° percentile) con il test di logica multidominio. Profilo: ${R.per.map(p=>`${p.sec.short} ${Math.round(p.correct/p.n*100)}%`).join(', ')}. Provalo anche tu: ${location.origin+location.pathname.replace(/[^/]*$/,'')}`;
  return`
  <div class="stack">
    <div class="eyebrow">${NORM.label} · ${TOTAL_ITEMS} item${dur!==null?` · ${dur} min`:''}</div>
    <h1>Il tuo punteggio</h1>
  </div>
  <div class="score">
    <span class="eyebrow">QI stimato (media 100, DS 15)</span>
    <span class="big">${R.iq}</span>
    <span class="ci">Intervallo di confidenza al 95%: <b class="mono">${R.lo}–${R.hi}</b> · circa il <b>${R.pct}°</b> percentile</span>
    <span class="label">${iqLabel(R.iq)}</span>
  </div>
  <div class="card stack">
    <h2>Profilo per dominio</h2>
    <div class="bars">${R.per.map(p=>`<div class="barrow"><span class="name">${esc(p.sec.name)}</span><span class="track"><i style="width:${p.correct/p.n*100}%"></i></span><span class="val">${p.correct}/${p.n}</span></div>`).join('')}</div>
    <p class="hint">Punteggio grezzo totale: <b class="mono">${R.raw}/${TOTAL_ITEMS}</b>. Con ${SECTIONS[0].items.length} item per dominio, le differenze tra domini sono indicative: uno scarto di ${FORM==='short'?'1–2':FORM==='ext'?'3–4':'2–3'} punti rientra nel margine di errore.</p>
  </div>
  <div class="card stack">
    <h2>Attendibilità di questa somministrazione</h2>
    <div class="flags">${flags.map(f=>`<div class="flag ${f.ok?'ok':''}">${f.ok?'✓':'!'} <span>${f.t}</span></div>`).join('')}</div>
  </div>
  <div class="note"><strong>Non è un test clinico.</strong> Questo punteggio è una stima a scopo indicativo. La conversione usa parametri provvisori (media grezza ${NORM.mean}, DS ${NORM.sd}, attendibilità attesa ${NORM.rel}) scelti a priori e non ricavati da un campione normativo: il valore va letto come posizione relativa in questo test, non come QI clinico. Una diagnosi o una misura ufficiale richiede una valutazione con strumenti standardizzati somministrati da uno psicologo.</div>
  <div class="card stack share"><h3>Condividi il risultato</h3><textarea id="shareTxt" readonly>${esc(shareTxt)}</textarea><div class="actions"><button class="btn primary" data-act="share">Copia il testo</button><a class="btn" href="sfide/">⚔️ Sfida un amico</a><a class="btn" href="./#profilo">Vedi il tuo profilo</a></div></div>
  <div class="card stack"><h3>Taratura</h3><div id="sendStatus" class="hint">${sendStatusHtml()}</div></div>
  <details><summary>Tabella di conversione: punteggio grezzo, QI, percentile</summary><div class="body">${conversionTableHtml(R.raw)}</div></details>
  <details><summary>Rivedi le risposte</summary><div class="body"><p class="hint">Attenzione: dopo aver visto le soluzioni, una nuova prova non sarà più attendibile.</p>${review}</div></details>
  <div class="actions"><button class="btn" data-act="restart">Rifai il test</button><a class="btn" href="./">Torna alla home</a></div>`;
}

// ========================= avvio =========================
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state.screen==='item')state.hidden++});
function boot(data){
  if(data&&data.state&&data.state.answers){applyForm(data.state.form||'full');state=Object.assign(freshState(),data.state);if(state.screen==='item'){startTimer();if(state.mem&&state.mem.phase==='show')state.mem=null}}
  render();
  if(location.hash==='#breve'&&state.screen==='intro'){const b=$('#startBtns');if(b)setTimeout(()=>b.scrollIntoView({behavior:'smooth',block:'center'}),300)}
}
if(window.claude&&window.claude.hot){
  try{window.claude.hot.snapshot(()=>({state}))}catch(e){}
  if(window.claude.hot.ready)window.claude.hot.ready(boot);else boot(window.claude.hot.data||{});
}else boot({});
})();
</script>
